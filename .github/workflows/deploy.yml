name: Deploy AakashPlay to Netlify

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Application
        run: npm run build
        env:
          VITE_FIREBASE_DB_URL: ${{ secrets.VITE_FIREBASE_DB_URL }}
          VITE_STORE_NAME: AakashPlay
          VITE_DEVELOPER_NAME: Aakash Sakhalkar
          VITE_DEVELOPER_GITHUB: https://github.com/aakashsakhalkar
          VITE_DEVELOPER_PORTFOLIO: https://aakash-sakhalkar.web.app/
          VITE_STORE_TAGLINE: Explore, test & download Android Apps, Web Applications and Open-Source Libraries.
          VITE_STORE_VERSION: 1.0.0
          VITE_ENABLE_AUTO_REFRESH: true
          VITE_POLL_INTERVAL_MS: 20000

      - name: Deploy to Netlify Production
        run: npx netlify-cli deploy --dir=dist --prod
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
