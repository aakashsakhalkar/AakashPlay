<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#c026d3" />
    </linearGradient>

    <!-- Letter A Body Gradient -->
    <linearGradient id="letterAGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ede9fe" />
    </linearGradient>

    <!-- Play Arrow Accent -->
    <linearGradient id="playArrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c026d3" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
  </defs>

  <!-- 3D Squircle Container -->
  <rect x="2" y="2" width="44" height="44" rx="14" fill="url(#bgGrad)" />
  <rect x="3" y="3" width="42" height="42" rx="13" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1.5" fill="none" />

  <!-- Bold & Unmistakable Letter 'A' -->
  <path 
    fill-rule="evenodd"
    clip-rule="evenodd"
    d="M 24 7.5
       C 25.2 7.5 26.2 8.3 26.8 9.5
       L 39 37.5
       C 39.5 38.6 38.7 40 37.5 40
       L 31 40
       C 30.1 40 29.3 39.4 28.9 38.5
       L 26.8 33
       L 21.2 33
       L 19.1 38.5
       C 18.7 39.4 17.9 40 17 40
       L 10.5 40
       C 9.3 40 8.5 38.6 9 37.5
       L 21.2 9.5
       C 21.8 8.3 22.8 7.5 24 7.5 Z
       
       M 20.5 17
       C 19.7 16.4 18.5 17 18.5 18
       L 18.5 28
       C 18.5 29 19.7 29.6 20.5 29
       L 28.5 24
       C 29.3 23.5 29.3 22.5 28.5 22
       L 20.5 17 Z"
    fill="url(#letterAGrad)"
  />

  <!-- Embedded Neon Play Arrow Center -->
  <path 
    d="M 20.5 17
       C 19.7 16.4 18.5 17 18.5 18
       L 18.5 28
       C 18.5 29 19.7 29.6 20.5 29
       L 28.5 24
       C 29.3 23.5 29.3 22.5 28.5 22
       L 20.5 17 Z"
    fill="url(#playArrowGrad)"
  />
</svg>